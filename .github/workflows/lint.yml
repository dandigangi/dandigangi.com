# Lint and tests, deliberately not the build.
#
# Vercel already builds every push and every branch, and never promotes a failed
# build — so a workflow running `yarn build` would duplicate that and fail in the
# same place, slower. What Vercel does not run is ESLint (Next 16 removed the
# lint-during-build integration) or the test suite. The pre-commit hook runs the
# tests too; this is the copy that cannot be skipped with --no-verify.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Velite generates .velite, which the TypeScript path alias '@/content'
      # resolves to. Without it, lint fails on unresolved imports.
      - name: Build content
        run: yarn velite

      - name: Lint
        run: yarn lint

      # The frontmatter tests read every file in data/blog and assert each one
      # survives an edit untouched, so they need the real posts, not fixtures.
      - name: Test
        run: yarn test
